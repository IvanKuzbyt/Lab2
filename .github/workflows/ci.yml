name: Python CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type checking
        run: mypy src
      - name: Pytest
        run: pytest -v
      - name: Package build
        run: python -m build
      - name: Check artifacts
        run: |
          ls -la dist/*.whl
          ls -la dist/*.tar.gz
      - name: Docker build
        run: docker build -t warehouse-manager:ci .
