[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-manager-oop"
version = "1.0.0"
description = "Warehouse inventory management: persistence, REST API, analytics and production tooling"
readme = "README.md"
authors = [{name = "Ivan Kuzbyt"}]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "SQLAlchemy>=2.0", "alembic>=1.13", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "numpy>=1.26", "pydantic-settings>=2.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "typing_extensions>=4.8",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "build>=1.2",
    "wheel>=0.45",
    "types-PyYAML"
]

[project.scripts]
warehouse-manager = "warehouse_manager.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: end-to-end pipeline tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"

# Legacy modules from Labs 7–9 are incrementally typed.
# Preserve type checking of annotated code while allowing older untyped APIs.
[[tool.mypy.overrides]]
module = ["warehouse_persistence.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.coverage.run]
branch = true
source = ["reliable_importer", "warehouse_manager", "data_processor"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
exclude = ["migrations", "benchmarks/results", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
