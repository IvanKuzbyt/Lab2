[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-manager-oop"
version = "0.9.0"
description = "Lab 4 OOP model integrated with Lab 3 streaming warehouse pipeline"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "SQLAlchemy>=2.0", "alembic>=1.13", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "typing_extensions>=4.8", "pytest-asyncio>=0.23"]

[project.scripts]
warehouse-manager = "warehouse_manager.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: end-to-end pipeline tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["reliable_importer", "warehouse_manager", "data_processor"]

[tool.coverage.report]
show_missing = true
skip_covered = false
